<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign up — QRfy Clone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg"/>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="stylesheet" href="/css/auth.css"/>
</head>
<body>
<header class="topnav">
  <div class="topnav-inner">
    <a href="/" class="brand"><span class="logo-mark">Q</span>QRfy Clone</a>
    <div class="nav-actions"><a href="/login" class="btn btn-ghost">Log in</a></div>
  </div>
</header>
<div class="auth-wrap">
  <div class="auth-card card card-pad">
    <h1>Create your account</h1>
    <p class="muted">Free forever. No credit card required.</p>
    <div id="error" class="form-error"></div>
    <form id="signup-form">
      <div class="field"><label>Full name</label><input type="text" name="name" required placeholder="Jane Doe"/></div>
      <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@example.com"/></div>
      <div class="field"><label>Password</label><input type="password" name="password" required minlength="6" placeholder="At least 6 characters"/></div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="/login">Log in</a></div>
  </div>
</div>
<script src="/js/common.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const prefill = params.get('prefill');
  const form = document.getElementById('signup-form');
  const errorBox = document.getElementById('error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    const fd = new FormData(form);
    try {
      await api('/signup', { method: 'POST', body: { name: fd.get('name'), email: fd.get('email'), password: fd.get('password') } });
      location.href = prefill ? '/app/editor?type=url&prefill=' + encodeURIComponent(prefill) : '/app/dashboard';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    }
  });
</script>
</body>
</html>
